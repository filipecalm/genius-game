<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genius Game — treine sua memória</title>
    <meta
      name="description"
      content="Jogue Genius online: repita sequências de cores e sons, suba de nível e desafie sua memória no clássico jogo retrô."
    />
    <link rel="canonical" href="https://genius-game.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://genius-game.netlify.app/" />
    <meta property="og:title" content="Genius Game — treine sua memória" />
    <meta
      property="og:description"
      content="Repita sequências de cores e sons no clássico Genius. Modo strict, placar e desafios progressivos."
    />
    <meta property="og:image" content="https://genius-game.netlify.app/images/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Genius Game — treine sua memória" />
    <meta
      name="twitter:description"
      content="Repita sequências de cores e sons no clássico Genius. Modo strict, placar e desafios progressivos."
    />
    <meta name="twitter:image" content="https://genius-game.netlify.app/images/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Iceland&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <main class="stage">
      <section class="device" aria-label="Genius">
        <div class="device__glow" aria-hidden="true"></div>
        <div class="device__rim">
          <div class="game">
            <button type="button" class="game__pad game__pad-tl" aria-label="Verde"></button>
            <button type="button" class="game__pad game__pad-tr" aria-label="Vermelho"></button>
            <button type="button" class="game__pad game__pad-bl" aria-label="Amarelo"></button>
            <button type="button" class="game__pad game__pad-br" aria-label="Azul"></button>

            <div class="game__console">
              <h1 class="game__title">Genius<span class="reg">®</span></h1>

              <div class="gui">
                <div class="group">
                  <div class="gui__counter" aria-live="polite">--</div>
                  <p class="gui__label">count</p>
                </div>

                <div class="group">
                  <button type="button" class="gui__btn gui__btn-start" aria-label="Start"></button>
                  <p class="gui__label">start</p>
                </div>

                <div class="group">
                  <div class="gui__led" aria-hidden="true"></div>
                  <button type="button" class="gui__btn gui__btn-strict" aria-label="Strict"></button>
                  <p class="gui__label">strict</p>
                </div>
              </div>

              <div class="gui__power">
                <span class="gui__label">on</span>
                <button type="button" class="gui__btn-switch" aria-label="Ligar ou desligar" aria-pressed="false"></button>
                <span class="gui__label">off</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-social">
        <a href="https://www.instagram.com/filipealm09/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a href="https://www.linkedin.com/in/filipecalm/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
        <a href="https://github.com/filipecalm" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
          <ion-icon name="logo-github"></ion-icon>
        </a>
      </div>
      <p class="footer-text">Feito com <span class="heart">❤</span> por <span class="author">Filipe Almeida</span></p>
    </footer>

    <aside class="consent consent--hidden" data-consent aria-hidden="true" role="dialog" aria-label="Consentimento de cookies">
      <p class="consent__text">
        Usamos cookies de analytics (Google Analytics) só com o seu ok. Sem consentimento, nada de tracker.
      </p>
      <div class="consent__actions">
        <button type="button" class="consent__btn consent__btn--ghost" data-consent-reject>Recusar</button>
        <button type="button" class="consent__btn consent__btn--solid" data-consent-accept>Aceitar</button>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
